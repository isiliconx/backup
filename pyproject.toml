[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guestvault"
version = "0.3.1"
description = "Compressed VM backups and recovery bundles with optional password protection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "isiliconx"}]
dependencies = []

[project.scripts]
guestvault = "guestvault.cli:main"

[tool.setuptools.package-data]
guestvault = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
